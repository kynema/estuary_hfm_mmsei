cases:
  - name: 2d_bump_ufr_smag_final_islam1
    label: SGF IB Smagorinsky Lam True
    type: sgf
    format: netcdf
    path: /tscratch/ndeveld/estuary/2d_periodichill_ufr2_smag_last_islam1
    point_sample_file: psampling00000.nc
    plane_sample_file: [sampling00000.nc]
    probe_plots: true
    plane_processing: true
    opt: [135,215,215, 100.0, 0.3785]
  - name: 2d_bump_ufr_smag_final_islam0
    label: SGF IB Smagorinsky Lam False
    type: sgf
    format: netcdf
    path: /tscratch/ndeveld/estuary/2d_periodichill_ufr2_smag_last_islam0
    point_sample_file: psampling00000.nc
    plane_sample_file: [sampling00000.nc]
    probe_plots: false
    plane_processing: true
    opt: [135,215,215, 100.0, 0.3785]
  - name: ugf_iddes
    label: UGF IDDES
    type: ugf
    format: netcdf
    path: /tscratch/ndeveld/estuary/ugf_periodic_hill_final_cub1
    probe_plots: false
    plane_processing: true
    opt: [4000,4500,4500, 100.0, 0.3785]
    plane_template: sample_plane_{i}_0.dat
    plane_options: [4100,12000,100]
  - name: ugf_smag
    label: UGF Smagorinsky
    type: ugf
    format: netcdf
    path: /tscratch/ndeveld/estuary/ugf_periodic_hill_final_smag_cub1
    probe_plots: false
    plane_processing: true
    opt: [4000,4500,4500, 100.0, 0.3785]
    plane_template: sample_plane_{i}_0.dat
    plane_options: [4100,12000,100]

    # UGF: Need 12000 steps for approx 100 flow-throughs
    # SGF: Need 100 plane output steps for 100 flow-throughs



