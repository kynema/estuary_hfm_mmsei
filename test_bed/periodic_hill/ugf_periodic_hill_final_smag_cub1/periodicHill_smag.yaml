Simulations:
  - name: sim1
    optimizer: opt1
    time_integrator: ti_1

# Hypre memory and other configurations
hypre_config:
  umpire_device_pool_mbs: 4096
  use_vendor_spgemm: 1
  use_vendor_spmv: 0
  use_vendor_sptrans: 0

linear_solvers:
  # solver for the momentum
  - name: solve_mom
    type: hypre
    method: hypre_gmres
    preconditioner: boomerAMG
    tolerance: 1e-5
    max_iterations: 1000
    kspace: 1000
    sync_alg: 1
    output_level: 0
    write_matrix_files: no
    #write_preassembly_matrix_files: yes
    recompute_preconditioner_frequency: 1
    reuse_linear_system: yes
    simple_hypre_matrix_assemble: yes
    dump_hypre_matrix_stats: no
    segregated_solver: yes
    hypre_cfg_file: /gpfs/ndeveld/vorlap/vorlap_airfoil1/templates/hypre_file.yaml
    hypre_cfg_node: hypre_simple_precon

  # solver for the scalars TKE, SDR
  - name: solve_scalar
    type: hypre
    method: hypre_gmres
    preconditioner: boomerAMG
    tolerance: 1e-5
    max_iterations: 1000
    kspace: 1000
    sync_alg: 1
    output_level: 0
    write_matrix_files: no
    #write_preassembly_matrix_files: yes
    recompute_preconditioner_frequency: 1
    reuse_linear_system: yes
    simple_hypre_matrix_assemble: yes
    dump_hypre_matrix_stats: no
    hypre_cfg_file: /gpfs/ndeveld/vorlap/vorlap_airfoil1/templates/hypre_file.yaml
    hypre_cfg_node: hypre_simple_precon

  # solver for the pressure
  - name: solve_elliptic
    type: hypre
    method: hypre_gmres
    preconditioner: boomerAMG
    tolerance: 1e-5
    max_iterations: 1000
    kspace: 1000
    sync_alg: 1
    output_level: 0
    write_matrix_files: no
    #write_preassembly_matrix_files: yes
    recompute_preconditioner_frequency: 1
    reuse_linear_system: yes
    simple_hypre_matrix_assemble: yes
    dump_hypre_matrix_stats: no
    hypre_cfg_file: /gpfs/ndeveld/vorlap/vorlap_airfoil1/templates/hypre_file.yaml
    hypre_cfg_node: hypre_elliptic

realms:

- name: realm_1
  #mesh: /rlfs01/ndeveld/estuary/estuary_hfm_mmsei/test_bed/mesh/periodic_hill.exo
  mesh: /rlfs01/ndeveld/estuary/estuary_hfm_mmsei/test_bed/ugf_periodic_hill_test5/restart_sstiddes/periodicHill.rst
  #automatic_decomposition_type: rcb
  #rebalance_mesh: yes
  #stk_rebalance_method: parmetis
  check_jacobians: true
  
  equation_systems:
    name: theEqSys
    max_iterations: 4

    solver_system_specification:
      velocity: solve_mom
      pressure: solve_elliptic

    systems:

    - LowMachEOM:
        name: myLowMach
        max_iterations: 1
        convergence_tolerance: 1.0e-8


  initial_conditions:
  - constant: ic_1
    target_name: fluid-hex
    value:
      pressure: 0
      velocity: [0.3, 0.0, 0.0]

  material_properties:
    target_name: fluid-hex
    specifications:
    - name: density
      type: constant
      value: 1000.0
    - name: viscosity
      type: constant
      value: 1.0e-3

  boundary_conditions:

  - wall_boundary_condition: bc_top
    target_name: top
    wall_user_data:
      velocity: [0, 0, 0]
      use_wall_function: no

  - wall_boundary_condition: bc_wall
    target_name: hills
    wall_user_data:
      velocity: [0, 0, 0]
      use_wall_function: no

  - periodic_boundary_condition: bc_inlet_outlet
    target_name: [inlet, outlet]
    periodic_user_data:
      search_tolerance: 0.0001

  - periodic_boundary_condition: bc_front_back
    target_name: [wall_fore, wall_aft]
    periodic_user_data:
      search_tolerance: 0.0001

  solution_options:
    name: myOptions
    turbulence_model: smagorinsky
    projected_timescale_type: momentum_diag_inv

    fix_pressure_at_node:
      value: 0.0
      node_lookup_type: spatial_location
      location: [0.001, 0.001, 0.084]
      search_target_part: [fluid-hex]
      search_method: stk_kdtree

    options:
    - hybrid_factor:
        velocity: 1.0

    - alpha_upw:
        velocity: 0.0

    - upw_factor:
        velocity: 1.0

    - noc_correction:
        pressure: yes

    - projected_nodal_gradient:
        velocity: element
        pressure: element

    - relaxation_factor:
        velocity: 0.7
        pressure: 0.3

    - source_terms:
        momentum: body_force_box

    - source_term_parameters:
        momentum: [0.05, 0.0, 0.0]
        momentum_box: [0.0, 0.0, 0.0, 0.252, 0.126, 0.085]  # ymin=-1 to dynamic force everywhere
    
    - dynamic_body_force_box_parameters:
        forcing_direction: 0
        velocity_reference: 0.3785
        density_reference: 1000.0
        velocity_target_name: inlet
        drag_target_name: [top, hills]
        output_file_name: forcing.dat

  post_processing:
  - type: surface
    physics: surface_force_and_moment
    output_file_name: periodicHill_surface.dat
    frequency: 1
    parameters: [0, 0]
    target_name: [top, hills]

  data_probes:
    output_frequency: 50
    output_format: text
    search_method: stk_kdtree
    search_tolerance: 1.0e-3
    search_expansion_factor: 2.0

    gzip_level: 0
    write_coords: true

    specifications:
      - name: probe_profile
        from_target_part: fluid-hex

        plane_specifications:
          - name: sample_plane
            corner_coordinates:  [0.0, 0.0, 0.0]
            edge1_vector:    [0, 0.126, 0]
            edge2_vector:    [0, 0.0, 0.085]
            edge1_numPoints: 128
            edge2_numPoints: 88
            offset_vector:   [1, 0, 0]
            offset_spacings: [0.0014, 0.014, 0.028, 0.056, 0.084, 0.112, 0.14, 0.168, 0.196, 0.224]

        output_variables:
          - field_name: velocity
            field_size: 3
          - field_name: pressure
            field_size: 1
          - field_name: turbulent_viscosity
            field_size: 1

      - name: probe_line
        from_target_part: fluid-hex

        line_of_site_specifications:
          - name: probeLine 
            number_of_points: 12
            tip_coordinates: [0.126, 0.063, 0.028]
            tail_coordinates: [0.126, 0.063, 0.083]

        output_variables:
          - field_name: velocity
            field_size: 3

  restart:
    restart_data_base_name: restart_smag/periodicHill.rst
    restart_frequency: 500
    restart_time: 20.000000  #3999.99999999694

  output:
    output_data_base_name: results_smag/periodicHill.e
    output_frequency: 200
    output_node_set: no
    output_variables:
    - velocity
    - density
    - pressure
    - pressure_force
    - viscous_force
    - tau_wall
    - turbulent_viscosity

Time_Integrators:
- StandardTimeIntegrator:
    name: ti_1
    start_time: 20.0 #3999.99999999694
    time_step: 5.0e-3
    termination_step_count: 20000000 #100123
    time_stepping_type: fixed
    time_step_count: 4000
    second_order_accuracy: yes

    realms:
    - realm_1
